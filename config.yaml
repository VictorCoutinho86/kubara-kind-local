version: v1alpha4
clusters:
  - name: test-cluster
    stage: local
    type: hub
    dnsName: coutinho.local
    ssoOrg: local
    ssoTeam: local
    ingressClassName: traefik
    argocd:
      selfManaged: enabled
      repo:
        https:
          configs:
            url: https://github.com/VictorCoutinho86/kubara-kind-local.git
            targetRevision: main
          components:
            url: https://github.com/VictorCoutinho86/kubara-kind-local.git
            targetRevision: main
    catalogs:
      - oci://ghcr.io/kubara-io/catalogs/general:2.0.0
    services:
      cert-manager:
        status: enabled
        config:
          clusterIssuer:
            email: yourname@your-domain.de
            name: letsencrypt-staging
            server: https://acme-staging-v02.api.letsencrypt.org/directory
      external-dns:
        status: disabled
      external-secrets:
        status: enabled
      homer-dashboard:
        status: enabled
      kube-prometheus-stack:
        status: enabled
      kyverno:
        status: disabled
      kyverno-policies:
        status: disabled
      kyverno-policy-reporter:
        status: disabled
      loki:
        status: enabled
      longhorn:
        status: disabled
      metallb:
        status: disabled
      metrics-server:
        status: enabled
      oauth2-proxy:
        status: disabled
      reloader:
        status: enabled
      traefik:
        status: enabled
      velero:
        status: disabled
        config:
          backupMode: fs-backup
          backupStorage:
            create: true
            region: eu01
